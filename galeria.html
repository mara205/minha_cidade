<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="key-words" content="Paris">
    <title>Galeria</title>
    <link rel="stylesheet" href="css/galeria.css">
</head>

<body>
    <header>
        <img src="imagens/bandeira_paris.jpg"
            alt="bandeira da cidade de Paris, representada pelo brasão da cidade sobre um fundo divido verticamente entre as cores azul e vermelho.">
        <h1 id="h1">Galeria de Imagens</h1>

        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>

            </ul>

        </nav>
    </header>
    <main>
        <div id="img1">
            <div class="item_imagem">
                <figure>
                    <img src="imagens/eiffel_tarde.jpg"
                        alt="fotografia da torre eiffel, tirada de um ângulo frontal baixo e com um filtro sépia.">
                </figure>
            </div>

            <div class="item_imagem">
                <figure>
                    <img src="imagens/vila.jpg"
                        alt="fotografia frontal de um conjunto de casas, tirada durante o dia. Flores adornam as sacadas das construções, 
                   com uma escada e um lampião em estilo clássico logo à frente. Uma bicicleta ocupa o foco principal da imagem, apoiada entre a escada e o lampião.">
                </figure>
            </div>
            <div class="item_imagem">
                <figure>
                    <img src="imagens/fim_tarde.jpg"
                        alt="fotografia de uma árvore repleta de flores, tirada durante o dia e de um ângulo baixo.
                     Apenas os galhos mais altos da árvore são visíveis, destacando-se contra o céu encoberto por de nuvens.">
                </figure>
            </div>
            <div class="item_imagem">
                <figure>
                    <img src="imagens/vaso_flores.jpg" alt="fotogarfia de uma janela, pela qual entra a luz do sol. A janela é envolta por uma cortina e 
                    em seu parapeito há um vaso com flores.">
                </figure>
            </div>


        </div>
        <div id="img2">
            <div class="item_imagem">
                <figure>
                    <img src="imagens/louvre_tarde.jpg" alt="fotografia do museu do Louvre, tirada durante o fim da tarde. 
                    Tanto o museu quanto as construções ao seu redor se encontarm iluminadas.">
                </figure>
            </div>
            <div class="item_imagem">
                <figure>
                    <img src="imagens/sena_tarde.jpg" alt="fotografia do Rio Sena, tirada durante o fim da tarde. Barcos 
                    cruzam o rio e em suas margens são visíveis diversas construções e vegetações.">
                </figure>
            </div>
            <div class="item_imagem">
                <figure>
                    <img src="imagens/cidade_paris.jpg"
                        alt="fotografia da Torre Eiffel, tirada durante o início da tarde.
                     A torre ocupa o centro da imagem, cercada pelas diversas árvores e construções que compõem o cenário da cidade de Paris.">
                </figure>
            </div>
            <div class="item_imagem">
                <figure>
                    <img src="imagens/por_sol.jpg" alt="fotogarfia de um pôr do sol dourado sobre as águas do mar.">
                </figure>
            </div>
            <div class="item_imagem">
                <figure>
                    <img src="imagens/rosas_amarelas.jpg" alt="fotografia de um ramo de rosas amarelas.">
                </figure>
            </div>

            <div class="item_imagem">
                <figure>
                    <img src="imagens/buque_rosas.jpg"
                        alt="fotografia de um buquê de flores sobre um banco de madeira.">
                </figure>
            </div>
            <div class="item_imagem">
                <figure>
                    <img src="imagens/notredame_tarde.jpg"
                        alt="fotografia da catedral de Notre-Dame, tirada durante o dia e de um ângulo frontal.">
                </figure>
            </div>
            <div class="item_imagem">
                <figure>
                    <img src="imagens/begonias.jpg"
                        alt="fotografia de um ramo de flores, sobre o qual voa uma borboleta.">
                </figure>
            </div>
            <div class="item_imagem">
                <figure>
                    <img src="imagens/rosa_vermelha.jpg" alt="fotografia de um buquê de rosas vermelhas.">
                </figure>
            </div>



        </div>


    </main>

    <footer>
        <span id="footer2">Paris<br></span><span id="footer">França</span>
    </footer>
</body>

</html>
